<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码上报 - 社区民情收集平台</title>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.container {
  text-align: center;
  background: #fff;
  padding: 48px 40px;
  border-radius: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
h1 {
  font-size: 24px;
  color: #333;
  margin-bottom: 8px;
}
.subtitle {
  font-size: 14px;
  color: #999;
  margin-bottom: 32px;
}
canvas {
  display: block;
  margin: 0 auto 24px;
  border-radius: 12px;
}
.url-text {
  font-size: 13px;
  color: #666;
  word-break: break-all;
  background: #f8f9fa;
  padding: 10px 16px;
  border-radius: 8px;
  display: inline-block;
}
.note {
  font-size: 12px;
  color: #999;
  margin-top: 20px;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="container">
  <h1>📷 扫码上报</h1>
  <p class="subtitle">社区民情收集平台 - 手机端</p>
  <canvas id="qr"></canvas>
  <div class="url-text" id="urlDisplay"></div>
  <p class="note">
    请使用手机扫码打开上报页面<br>
    或直接在手机浏览器中输入上方网址
  </p>
</div>
<script>
(function() {
  var url = 'http://192.168.0.123:3001/';
  document.getElementById('urlDisplay').textContent = url;
  new QRious({
    element: document.getElementById('qr'),
    value: url,
    size: 240,
    level: 'M',
    background: '#fff',
    foreground: '#1890ff'
  });
})();
</script>
</body>
</html>
