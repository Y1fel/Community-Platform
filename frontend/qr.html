<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>扫码预览</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1890ff 0%, #096dd9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 48px 40px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 32px;
    }
    #qrcode {
      display: inline-block;
      padding: 16px;
      background: #fff;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      margin-bottom: 8px;
    }
    #qrcode img { display: block; }
    .url-text {
      font-size: 13px;
      color: #666;
      word-break: break-all;
      margin-top: 16px;
      background: #f5f5f5;
      padding: 10px 16px;
      border-radius: 8px;
    }
    .tip {
      font-size: 13px;
      color: #999;
      margin-top: 20px;
      line-height: 1.6;
    }
    .tip strong { color: #1890ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 民情上报平台</h1>
    <p class="subtitle">手机扫码立即上报</p>
    <div id="qrcode"></div>
    <div class="url-text" id="urlDisplay"></div>
    <p class="tip">
      请确保手机和电脑连接<strong>同一个 Wi-Fi</strong><br>
      用微信/浏览器扫码即可打开
    </p>
  </div>

  <script>
    // 获取本机网络IP用于二维码
    const currentHost = location.hostname
    const isLocalhost = currentHost === 'localhost' || currentHost === '127.0.0.1'
    const networkUrl = 'http://192.168.1.16:3001/'
    // 优先使用查询参数 ?url=，否则自动选用网络地址
    const shareUrl = new URLSearchParams(location.search).get('url') || (isLocalhost ? networkUrl : location.origin + '/')
    document.getElementById('urlDisplay').textContent = shareUrl
    new QRCode(document.getElementById('qrcode'), {
      text: shareUrl,
      width: 240,
      height: 240,
      colorDark: '#1890ff',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    })
  </script>
</body>
</html>
