# H2 内嵌数据库开发配置（无需安装 MySQL）
# 使用方式：.\mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# 或 IDEA 中 VM options: -Dspring.profiles.active=dev

server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/community;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/seed-h2.sql

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: community-minqing-platform-jwt-secret-key-2026-must-be-long-enough
  expire-hours: 24

logging:
  level:
    com.community: debug
