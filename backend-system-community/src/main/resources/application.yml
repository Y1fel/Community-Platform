server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/community;AUTO_SERVER=TRUE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/seed-h2.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT锛堜笌鐧诲綍妯″潡鍚屼簨瀵归綈鏃跺彲璋冩暣锛?
jwt:
  secret: community-minqing-platform-jwt-secret-key-2026-must-be-long-enough
  expire-hours: 24

logging:
  level:
    com.community: debug

